<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>画像提示実験</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: sans-serif;
      text-align: center;
      background: #ffffff;
      color: #222222;
    }

    #status {
      margin: 20px 0;
      font-size: 20px;
    }

    #image-area {
      height: 65vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #stimulus {
      display: block;
      max-width: 90vw;
      max-height: 65vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    /* ブランク中の注視点 */
    #fixation {
      font-size: 32px;
      font-weight: normal;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <h1 id="status">画像提示実験</h1>

  <main id="image-area">
    <img id="stimulus" class="hidden" alt="提示画像">
    <div id="fixation" class="hidden">＋</div>
  </main>

  <script>
    // ===================================
    // 実験設定
    // ===================================

    // 画像候補数：imagesフォルダに保存されている画像のトータル枚数。任意の枚数に調整
    const TOTAL_IMAGES = 4;

    // 提示枚数：抽出する枚数。任意の枚数に調整
    const DISPLAY_COUNT = 2;

    // 1枚あたりの画像提示時間（秒）：任意の秒数に調整
    const DISPLAY_SECONDS = 5;

    // ブランク時間（秒）：任意の秒数に調整
    const BLANK_SECONDS = 1;

    // 秒をミリ秒に変換
    const DISPLAY_MS = DISPLAY_SECONDS * 1000;
    const BLANK_MS = BLANK_SECONDS * 1000;

    // 画像ファイルの場所。名前は、A連番.jpgで保存
    // 例：images/A001.jpg
    function getImageURL(number) {
      return `images/A${String(number).padStart(3, "0")}.jpg`;
    }

    // 同じタブ・ウィンドウの再読み込みで選択を維持
    const STORAGE_KEY = "image_experiment_selection_v1";

    // ===================================
    // ランダム抽出
    // ===================================

    function shuffle(array) {
      const result = [...array];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function getSelection() {
      const candidates = Array.from(
        { length: TOTAL_IMAGES },
        (_, i) => i + 1
      );

      try {
        const saved = sessionStorage.getItem(STORAGE_KEY);

        if (saved) {
          const parsed = JSON.parse(saved);

          if (
            Array.isArray(parsed) &&
            parsed.length === DISPLAY_COUNT &&
            new Set(parsed).size === DISPLAY_COUNT &&
            parsed.every(
              n => Number.isInteger(n) &&
                   n >= 1 && n <= TOTAL_IMAGES
            )
          ) {
            return parsed;
          }
        }
      } catch (error) {
        // 保存情報が利用できない場合は新しく抽出
      }

      const selected = shuffle(candidates).slice(0, DISPLAY_COUNT);

      try {
        sessionStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(selected)
        );
      } catch (error) {
        // 保存できなくても実験は続行
      }

      return selected;
    }

    // ===================================
    // 画像の事前読み込み
    // ===================================

    function preloadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();

        img.onload = () => resolve(url);
        img.onerror = () => reject(new Error(url));

        img.src = url;
      });
    }

    // ===================================
    // 時間待ち
    // ===================================

    function wait(ms) {
      return new Promise(resolve => {
        setTimeout(resolve, ms);
      });
    }

    // ===================================
    // ブランク画面
    // 白い画面の中央に十字を表示
    // ===================================

    async function showBlank() {
      const stimulus = document.getElementById("stimulus");
      const fixation = document.getElementById("fixation");

      stimulus.classList.add("hidden");
      stimulus.removeAttribute("src");

      fixation.classList.remove("hidden");

      await wait(BLANK_MS);

      fixation.classList.add("hidden");
    }

    // ===================================
    // 画像提示実験
    // ===================================

    async function startExperiment() {
      const status = document.getElementById("status");
      const stimulus = document.getElementById("stimulus");
      const fixation = document.getElementById("fixation");

      // 設定の確認
      if (
        !Number.isInteger(TOTAL_IMAGES) ||
        !Number.isInteger(DISPLAY_COUNT) ||
        TOTAL_IMAGES < 1 ||
        DISPLAY_COUNT < 1 ||
        TOTAL_IMAGES < DISPLAY_COUNT ||
        DISPLAY_SECONDS <= 0 ||
        BLANK_SECONDS < 0
      ) {
        alert("実験設定を確認してください。");
        return;
      }

      // 開始確認
      alert("画像を提示します。");

      status.textContent = "画像を準備しています。";

      const selected = getSelection();
      const urls = selected.map(getImageURL);

      // 画像をすべて事前に読み込む
      try {
        await Promise.all(urls.map(preloadImage));
      } catch (error) {
        status.textContent =
          "画像を読み込めませんでした。画像ファイルを確認してください。";
        alert(
          "画像を読み込めませんでした。\n" +
          "画像ファイル名と保存場所を確認してください。"
        );
        return;
      }

      // =================================
      // ブランク → 画像 → ブランク → 画像
      // =================================

      for (let i = 0; i < urls.length; i++) {

        // 各画像の直前にブランクを挿入
        await showBlank();

        // 画像を提示
        status.textContent =
          `画像提示 ${i + 1} / ${DISPLAY_COUNT}`;

        fixation.classList.add("hidden");
        stimulus.src = urls[i];
        stimulus.classList.remove("hidden");

        // 指定秒数だけ表示
        await wait(DISPLAY_MS);

        // 次の画像へ進む前に非表示
        stimulus.classList.add("hidden");
        stimulus.removeAttribute("src");
      }

      // =================================
      // 終了
      // =================================

      fixation.classList.add("hidden");
      stimulus.classList.add("hidden");

      status.textContent = "お疲れ様でした。";

      // OKを押したらウィンドウを閉じる
      alert("お疲れ様でした。");

      window.close();
    }

    startExperiment();
  </script>
</body>
</html>
```
